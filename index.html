<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <title>현장 불량 기록</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css?v=13" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">3PL FIELD QA</p>
        <h1>현장 불량 기록</h1>
        <p class="sub">바코드 · 수량 · 사진</p>
      </div>
      <div class="status-card" id="connectionStatus" role="status" aria-live="polite">저장 준비</div>
    </section>

    <form id="defectForm" class="form-card" novalidate>
      <section class="block">
        <h2>제품</h2>
        <label>바코드
          <div class="scan-row">
            <input id="barcode" name="barcode" inputmode="text" autocomplete="off" placeholder="스캔 또는 직접 입력" />
            <button type="button" id="scanBarcode" class="ghost-btn" aria-label="바코드 카메라 스캔">📷 바코드 스캔</button>
          </div>
        </label>
        <p id="lookupMessage" class="inline-message" role="status" aria-live="polite"></p>
        <label>공급처
          <input id="supplierName" name="supplierName" placeholder="예: ○○상사" />
        </label>
        <label>상품명 <strong>*</strong>
          <input id="productName" name="productName" required placeholder="상품명 입력" />
        </label>
        <label>옵션
          <input id="optionName" name="optionName" placeholder="색상/사이즈 등" />
        </label>
      </section>

      <section class="block">
        <h2>검사</h2>
        <div class="compact-grid inspector-grid">
          <label>검사자 <strong>*</strong>
            <input id="inspectorName" name="inspectorName" required placeholder="이름" />
          </label>
          <label>현장명
            <input id="siteName" name="siteName" placeholder="창고/라인" />
          </label>
        </div>
        <input id="inspectionDate" name="inspectionDate" type="date" required hidden />
        <input id="deviceLabel" name="deviceLabel" placeholder="자동 저장됨" readonly hidden />
      </section>

      <section class="block qty-panel">
        <h2>수량</h2>
        <div class="qty-grid">
          <label>검사 수량 <strong>*</strong>
            <input id="totalInspectedQty" name="totalInspectedQty" type="number" min="1" step="1" inputmode="numeric" required placeholder="0" />
          </label>
          <div class="metric-field">
            <span>불량 수량</span>
            <b id="totalDefectQty">0개</b>
          </div>
        </div>
        <div class="rate-box"><span>불량률</span><b id="defectRate">0%</b></div>
      </section>

      <section class="block" id="photoBlock">
        <h2>사진 <strong>*</strong></h2>
        <label class="photo-drop">
          <input id="photos" name="photos" type="file" accept="image/*" capture="environment" multiple />
          <span>사진 추가</span>
          <small>사진별 유형/수량 입력</small>
        </label>
        <div class="photo-actions">
          <span id="photoSummary">선택된 사진 없음</span>
          <button type="button" id="clearPhotos" class="small-btn" hidden>사진 초기화</button>
        </div>
        <div id="preview" class="preview"></div>
      </section>

      <section class="block">
        <h2>메모</h2>
        <textarea id="memo" name="memo" rows="3" placeholder="특이사항, 조치 내용"></textarea>
      </section>

      <button id="submitBtn" class="submit-btn" type="submit">불량 기록 저장</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <section id="scannerPanel" class="scanner-panel" hidden>
      <div class="scanner-card">
        <div class="scanner-head">
          <strong>바코드 스캔</strong>
          <button type="button" id="closeScanner">닫기</button>
        </div>
        <video id="scannerVideo" playsinline muted></video>
        <p id="scannerHint">카메라 권한을 허용하고 바코드를 화면 중앙에 맞춰주세요.</p>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js?v=13"></script>
</body>
</html>
